schema_version: 1

context:
  name: deepspeed
  version: "0.19.9"
  build_number: 1
  torch_proc_type: ${{ "cuda" if cuda_compiler_version != "None" else "cpu" }}
  build_string_prefix: ${{ "cuda" ~ cuda_compiler_version | version_to_buildstring if cuda_compiler_version != "None" else "cpu" }}

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name }}-${{ version }}.tar.gz
  sha256: e14b514e243a92ad80bd92f74c835ef76a5c27eec23fae019807458fc9a8cb95
  patches:
    # Let DS_CPU_ARCH / DS_SIMD_WIDTH override build-machine detection
    # (-march=native) so pre-compiled CPU ops are portable, and pass link
    # flags (-fopenmp, -laio) when pre-compiling CPU ops.
    - patches/0001-Make-pre-compiled-CPU-ops-portable-and-fully-linked.patch

build:
  number: ${{ build_number }}
  string: ${{ build_string_prefix }}_py${{ python | version_to_buildstring }}_h${{ hash }}_${{ build_number }}
  skip:
    - win
    - osx and x86_64

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - ${{ stdlib("c") }}
    - if: build_platform != target_platform
      then:
        - cross-python_${{ target_platform }}
        - python
    - if: cuda_compiler_version != "None"
      then:
        - ${{ compiler('cuda') }}
        - cuda-profiler-api
        - libcublas-dev
        - libcurand-dev
        - libcusolver-dev
        - libcusparse-dev
  host:
    - pip
    - python
    - setuptools
    # Use {{ pytorch }} for the global pinning
    - pytorch ${{ pytorch }}.* [build=${{ torch_proc_type }}*]
    # For the `async_io` op
    - if: linux
      then: libaio
    # OpenMP runtime for the CPU ops built with -fopenmp
    - if: linux
      then: _openmp_mutex
    - if: osx
      then: llvm-openmp
    - if: cuda_compiler_version != "None"
      then:
        - cuda-profiler-api
        - libcublas-dev
        - libcurand-dev
        - libcusolver-dev
        - libcusparse-dev
        - oneccl-devel
  run:
    - einops
    - hjson-py
    - msgpack-python
    - numpy
    - packaging >=20.0
    - psutil
    - py-cpuinfo
    - pydantic >=2.0.0
    - python
    - pytorch >=2.0.0 [build=${{ torch_proc_type }}*]
    - tqdm
    - if: cuda_compiler_version != "None"
      then:
        - nvidia-ml-py

tests:
  - python:
      imports:
        - deepspeed
      pip_check: true
  - if: cuda_compiler_version == "None"
    then:
      # No ninja/compiler here: ops must load from the pre-compiled extensions
      - files:
          recipe:
            - test_cpu_ops.py
        script:
          - python test_cpu_ops.py
  - requirements:
      run:
        - ninja
    script:
      - ds_report
      - deepspeed --help

about:
  homepage: http://deepspeed.ai
  repository: https://github.com/deepspeedai/DeepSpeed
  summary: DeepSpeed library
  license: Apache-2.0
  license_file: LICENSE

extra:
  recipe-maintainers:
    - loadams
    - weiji14
    - sdvillal
